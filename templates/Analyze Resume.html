<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Screening System</title>
</head>

<body>

    <h1>AI-Based Resume Screening & Job Matching System</h1>

    <p>Upload your resume for AI analysis.</p>

    <form action="/upload" method="POST" enctype="multipart/form-data">

        <label for="resume">Choose Resume (PDF):</label>
        <br><br>

        <input 
            type="file" 
            id="resume" 
            name="resume" 
            accept=".pdf"
            required
        >

        <br><br>

        <button type="submit">Analyze Resume</button>

    </form>

</body>
</html>
